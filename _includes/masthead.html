{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="simple-nav">
        <a class="simple-nav__title" href="{{ base_path }}/">{{ site.title }}</a>
        <div class="simple-nav__links">
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              <a class="simple-nav__pill" href="{{ link.url }}" target="_blank" rel="noopener noreferrer">{{ link.title }}</a>
            {% else %}
              <a class="simple-nav__pill" href="{{ base_path }}{{ link.url }}">{{ link.title }}</a>
            {% endif %}
          {% endfor %}
        </div>
      </nav>
      <button id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"><i class="fas fa-moon" aria-hidden="true"></i></button>
    </div>
  </div>
</div>
