<!-- dark mode: toggle button + palette overrides; script kept free of line comments (GH Pages can flatten scripts) -->
<style>
  #theme-toggle { position: fixed; top: 0.65em; right: 0.8em; z-index: 1000; background: rgba(128, 128, 128, 0.18); border: 1px solid rgba(128, 128, 128, 0.25); border-radius: 999px; font-size: 0.95em; cursor: pointer; padding: 0.4em 0.55em; line-height: 1; color: #494e52; }
  #theme-toggle:hover { background: rgba(128, 128, 128, 0.32); }
  /* static masthead: title left, pill-button nav right (greedy-nav JS no longer targets this markup) */
  .simple-nav { display: flex; align-items: center; gap: 0.5em; min-height: 2.6em; }
  .simple-nav__links { margin-left: auto; display: flex; gap: 0.45em; align-items: center; }
  .simple-nav__pill { padding: 0.34em 0.9em; border: 1px solid rgba(128, 128, 128, 0.35); border-radius: 999px; font-size: 0.82em; color: #494e52; text-decoration: none; white-space: nowrap; line-height: 1.4; }
  .simple-nav__pill:hover { background: rgba(128, 128, 128, 0.14); }
  html.dark .simple-nav__pill { color: #d5dade; border-color: rgba(213, 218, 222, 0.3); }
  html.dark .simple-nav__pill:hover { background: rgba(213, 218, 222, 0.12); }
  @media (max-width: 420px) {
    .simple-nav__pill { padding: 0.3em 0.65em; font-size: 0.76em; }
  }
  @media (max-width: 767px) {
    #theme-toggle { top: auto; bottom: 1em; right: 0.9em; font-size: 0.85em; padding: 0.45em 0.55em; background: rgba(128, 128, 128, 0.22); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.22); }
  }
  html.dark #theme-toggle { color: #d5dade; }
  @media (max-width: 1199px) { html.dark .author__urls a i { color: inherit; } }
  html.dark, html.dark body { background-color: #14171a; color: #d5dade; }
  html.dark .masthead { background-color: #14171a; border-bottom-color: #2a2f34; }
  html.dark .greedy-nav { background-color: #14171a; }
  html.dark .greedy-nav a { color: #d5dade; }
  html.dark .navicon, html.dark .navicon:before, html.dark .navicon:after { background-color: #d5dade; }
  html.dark h1, html.dark h2, html.dark h3, html.dark h4, html.dark .page__title, html.dark .author__name { color: #eef1f3; }
  html.dark .page__content h2 { border-bottom-color: #2a2f34; }
  html.dark a { color: #7ec3e8; }
  html.dark .sidebar, html.dark .author__bio, html.dark .page__meta, html.dark .archive__item-excerpt { color: #a8b0b6; }
  html.dark .author__urls { background-color: transparent; border-color: transparent; }
  html.dark .fa-github, html.dark .fa-map-marker, html.dark .fa-map-marker-alt, html.dark .fa-location-dot { color: #a8b0b6; }
  html.dark .archive__subtitle { border-bottom-color: #2a2f34; }
  html.dark .page__footer { background-color: #1b1f23; }
  html.dark .page__footer, html.dark .page__footer a { color: #a8b0b6; }
  html.dark code { background-color: #1e2226; }
  html.dark .highlight, html.dark .highlight pre { background-color: #1e2226; }
  html.dark blockquote { border-left-color: #2a2f34; color: #a8b0b6; }
  html.dark hr { border-color: #2a2f34; }
  html.dark table { border-color: #2a2f34; }
  html.dark thead { background-color: #1e2226; }
  html.dark th, html.dark td { border-color: #2a2f34; }
</style>
<script>
  (function () {
    var stored = null;
    try { stored = localStorage.getItem('theme'); } catch (e) {}
    var dark = stored === 'dark' || (!stored && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) { document.documentElement.classList.add('dark'); }
    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) { return; }
      var paint = function () { var icon = document.documentElement.classList.contains('dark') ? 'sun' : 'moon'; btn.innerHTML = '<i class="fas fa-' + icon + '" aria-hidden="true"></i>'; };
      paint();
      btn.addEventListener('click', function () {
        var isDark = document.documentElement.classList.toggle('dark');
        try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) {}
        paint();
      });
    });
  })();
</script>
<script>
  /* mobile ergonomics: tap-to-zoom large figures; pause offscreen autoplay videos */
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.page__content img').forEach(function (img) {
      var apply = function () {
        if (img.naturalWidth > 900 && !img.closest('a')) {
          var a = document.createElement('a');
          a.href = img.src;
          a.setAttribute('aria-label', 'Open full-size image');
          img.parentNode.insertBefore(a, img);
          a.appendChild(img);
        }
      };
      if (img.complete) { apply(); } else { img.addEventListener('load', apply, { once: true }); }
    });
    if ('IntersectionObserver' in window) {
      var vids = document.querySelectorAll('.page__content video[autoplay]');
      if (vids.length) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) { e.target.play().catch(function () {}); }
            else { e.target.pause(); }
          });
        }, { rootMargin: '100px' });
        vids.forEach(function (v) { io.observe(v); });
      }
    }
  });
</script>
